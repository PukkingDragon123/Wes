<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BROKE @$$ RACCOON</title>
<style>
  :root { --bg:#06060b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:var(--bg); overflow:hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color:#cdd0e0; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 120% at 50% 0%, #14142a 0%, #0a0a16 45%, #050509 100%);
  }
  /* Scanline / vignette flavor behind + in front of the canvas */
  #wrap::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display:block;
    background:#0b0b17;
    box-shadow: 0 0 0 2px #1b1b33, 0 20px 60px rgba(0,0,0,.7);
    cursor: none;
  }
  #hint {
    position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
    z-index:6; font-size:11px; letter-spacing:.06em; color:#4c4f6b;
    opacity:.75; text-align:center; pointer-events:none; text-transform:uppercase;
  }
  #hint b{ color:#8a8fb8; }
  #rotate {
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:#06060b; color:#9aa; text-align:center; padding:24px; font-size:14px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="384" height="216"></canvas>
  </div>
  <div id="hint">Move <b>← →</b> · Jump <b>Z</b> · Climb <b>X</b> · Throw/Grab <b>C</b> · Hide/Dive <b>↓</b> · Pause <b>Esc</b></div>
  <div id="rotate">Rotate your device to landscape 🦝</div>

  <!-- Load order matters: each file augments the global RC namespace -->
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
