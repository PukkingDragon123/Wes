<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BROKE @$$ RACCOON</title>
<style>
  :root { --bg:#06060b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:var(--bg); overflow:hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color:#cdd0e0; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 120% at 50% 0%, #14142a 0%, #0a0a16 45%, #050509 100%);
  }
  /* Scanline / vignette flavor behind + in front of the canvas */
  #wrap::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display:block;
    background:#0b0b17;
    box-shadow: 0 0 0 2px #1b1b33, 0 20px 60px rgba(0,0,0,.7);
    cursor: none;
  }
  #hint { display:none; }
  #rotate {
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:#06060b; color:#9aa; text-align:center; padding:24px; font-size:14px;
  }
  /* ---- on-screen touch controls (shown only on touch devices) ---- */
  #touch{ display:none; position:fixed; inset:0; z-index:8; pointer-events:none;
    justify-content:space-between; align-items:flex-end; padding:16px 18px 20px; }
  body.touch #touch{ display:flex; }
  #touch .tbtn{ pointer-events:auto; -webkit-tap-highlight-color:transparent; touch-action:none;
    font:700 11px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.04em;
    color:#e6e8f6; background:rgba(30,28,54,.42); border:2px solid rgba(150,156,200,.35);
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    width:60px; height:60px; user-select:none; backdrop-filter:blur(2px); }
  #touch .tbtn.act{ background:rgba(120,110,190,.6); border-color:#b7b1e0; transform:scale(.94); }
  #touch .dpad{ display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px);
    gap:8px; grid-template-areas:". up ." "lf dn rt"; }
  #touch .up{grid-area:up} #touch .lf{grid-area:lf} #touch .dn{grid-area:dn} #touch .rt{grid-area:rt}
  #touch .dpad .tbtn{ font-size:18px; }
  #touch .acts{ display:grid; grid-template-columns:repeat(2,64px); grid-template-rows:repeat(2,60px);
    gap:9px; grid-template-areas:"atk jump" "climb throw"; align-items:end; }
  #touch .atk{grid-area:atk; background:rgba(160,60,72,.52); border-color:#e0a0a8;}
  #touch .jump{grid-area:jump; background:rgba(90,70,150,.52); border-color:#b7b1e0;}
  #touch .climb{grid-area:climb; font-size:10px;} #touch .throw{grid-area:throw; font-size:10px;}
  #touch .mapb{ position:absolute; top:14px; right:16px; width:auto; height:26px; padding:0 10px; font-size:10px; }
  body.touch #hint{ display:none; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="480" height="270"></canvas>
  </div>
  <div id="hint">Move <b>← →</b> · Jump <b>Z</b> · Climb <b>X</b> · Throw/Grab <b>C</b> · Hide/Dive <b>↓</b> · Pause <b>Esc</b></div>
  <div id="rotate">Rotate your device to landscape 🦝</div>

  <div id="touch" aria-hidden="true">
    <button class="tbtn mapb" data-k="Tab">MAP</button>
    <div class="dpad">
      <button class="tbtn up" data-k="ArrowUp">▲</button>
      <button class="tbtn lf" data-k="ArrowLeft">◀</button>
      <button class="tbtn dn" data-k="ArrowDown">▼</button>
      <button class="tbtn rt" data-k="ArrowRight">▶</button>
    </div>
    <div class="acts">
      <button class="tbtn atk" data-k="KeyX">HIT</button>
      <button class="tbtn jump" data-k="KeyZ">JUMP</button>
      <button class="tbtn climb" data-k="ShiftLeft">CLIMB</button>
      <button class="tbtn throw" data-k="KeyC">THROW</button>
    </div>
  </div>

  <!-- Load order matters: each file augments the global RC namespace -->
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/critter.js"></script>
  <script src="js/food.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
